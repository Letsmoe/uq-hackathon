version: "3"

# Build and deployment tasks for Synapse.
#
# Requires go-task (https://taskfile.dev). On Arch: pacman -S go-task
# Run `task` with no arguments to list everything.

vars:
  FRONTEND: frontend
  PACKAGE_ID: com.letsmoe.synapse
  ACTIVITY: com.letsmoe.synapse/.MainActivity
  APK: frontend/android/app/build/outputs/apk/debug/app-debug.apk
  DEMO_TRACK: Metrik - We Are The Energy.mp3

env:
  # Gradle 8.14 cannot read JDK 26+ bytecode. Override if yours lives elsewhere.
  JAVA_HOME: '{{.JAVA_HOME | default "/usr/lib/jvm/java-21-openjdk"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Setup ────────────────────────────────────────────────────────────────

  install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND}}"
    sources:
      - package.json
      - bun.lock
    generates:
      - node_modules/.package-lock.json
    cmds:
      - bun install

  demo:
    desc: Bundle a local track as the in-app demo song (dev only, not committed)
    preconditions:
      - sh: test -f "audios/{{.DEMO_TRACK}}"
        msg: 'audios/{{.DEMO_TRACK}} not found. Put a track in audios/ or pass DEMO_TRACK="name.mp3"'
    cmds:
      - cp "audios/{{.DEMO_TRACK}}" {{.FRONTEND}}/public/demo.mp3
      - 'echo "Bundled {{.DEMO_TRACK}} as the demo song."'

  demo:clear:
    desc: Remove the bundled demo song
    cmds:
      - rm -f {{.FRONTEND}}/public/demo.mp3

  # ── Chart generator ──────────────────────────────────────────────────────

  test:
    desc: Run the chart generator checks against synthesized drum tracks
    cmds:
      - bun test

  # ── Web ──────────────────────────────────────────────────────────────────

  dev:
    desc: Run the dev server on the LAN (open the Network URL on a tablet)
    deps: [install]
    dir: "{{.FRONTEND}}"
    cmds:
      - bun run dev --host

  check:
    desc: Typecheck (svelte-check + tsc)
    deps: [install]
    dir: "{{.FRONTEND}}"
    cmds:
      - bun run check

  build:
    desc: Production web build into frontend/dist
    deps: [install]
    dir: "{{.FRONTEND}}"
    cmds:
      - bun run build

  # ── Android ──────────────────────────────────────────────────────────────

  android:sync:
    desc: Sync the native project (points at your dev server unless CAP_BUNDLE=1)
    deps: [install]
    dir: "{{.FRONTEND}}"
    cmds:
      # CAPACITOR_BUILD disables the service worker, which otherwise serves a
      # stale precached bundle inside the WebView after every rebuild. The
      # build itself is only the offline fallback when CAP_BUNDLE=1 is set.
      - CAPACITOR_BUILD=1 bun run build
      - bunx cap sync android

  android:apk:
    desc: Assemble the debug APK
    deps: [android:sync]
    dir: "{{.FRONTEND}}/android"
    preconditions:
      - sh: test -d "$JAVA_HOME"
        msg: "JAVA_HOME ($JAVA_HOME) does not exist. Install JDK 21 or set JAVA_HOME."
    cmds:
      - ./gradlew assembleDebug
      - 'echo "APK: {{.APK}}"'

  android:install:
    desc: Install the debug APK on the connected device
    deps: [android:apk]
    preconditions:
      - sh: test -n "$(adb devices | sed '1d' | grep -w device)"
        msg: "No device connected. Enable USB debugging and check `adb devices`."
    cmds:
      - adb install -r "{{.APK}}"

  android:run:
    desc: Build, install and launch on the device (run `task dev` alongside)
    deps: [android:install]
    cmds:
      - adb shell am start -n {{.ACTIVITY}}

  android:bundle:
    desc: Same as android:run but self-contained — no dev server needed
    cmds:
      - CAP_BUNDLE=1 task android:run

  android:log:
    desc: Follow device logs (JS console, crashes, Capacitor)
    cmds:
      - adb logcat -c
      - adb logcat | grep --line-buffered -iE "console|AndroidRuntime|FATAL|Capacitor"

  android:fps:
    desc: Sample rendered frame rate from the device
    cmds:
      - adb logcat -d | grep -oE "fps=[0-9.]+" | tail -20

  android:uninstall:
    desc: Remove the app from the connected device
    cmds:
      - adb uninstall {{.PACKAGE_ID}}

  # ── Housekeeping ─────────────────────────────────────────────────────────

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.FRONTEND}}/dist
      - rm -rf {{.FRONTEND}}/android/app/build
      - rm -rf {{.FRONTEND}}/android/build

  clean:all:
    desc: Remove build output and installed dependencies
    deps: [clean]
    cmds:
      - rm -rf {{.FRONTEND}}/node_modules
