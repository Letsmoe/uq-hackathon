<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Fonts are linked here rather than @imported from global.css. Tailwind's
         own @import is inlined ahead of any later one, which puts a font
         @import past the top of the file, where the parser drops it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link href="/src/style/global.css" rel="stylesheet" />
    <meta name="description" content="Synapse: Rhythm Protocol" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="mask-icon" href="/icons/icon-512.png" color="#FFFFFF" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS home-screen launch: without these iOS opens in a Safari tab with
         full browser chrome, ignoring the manifest display mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Synapse: Rhythm Protocol</title>
  </head>
  <body>
    <div
      id="app"
      class="w-screen h-screen p-0 m-0 bg-black overflow-hidden"
    ></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
